<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;font:22px/1.3 "DejaVu Sans",sans-serif;color:#222}
#lg{position:absolute;left:0;right:0;bottom:18px;text-align:center}#lg span{display:inline-block;width:18px;height:18px;border-radius:50%;margin:0 6px 0 26px;vertical-align:-2px}</style></head>
<body><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 900, H = +q.get('h') || 1400;
const data = await (await fetch(q.get('data') || 'suit.json')).json();
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
r.setSize(W, H); r.setClearColor(0xffffff); document.body.appendChild(r.domElement);
if (q.get('legend')) { const d = document.createElement('div'); d.id = 'lg';
  d.innerHTML = '<b>NIC-Crazy_Ivan</b> — Bogatyr on an average body, an estimate:'
    + '<span style="background:#c62828"></span>P<span style="background:#1565c0"></span>N (256)'
    + '<i style="display:inline-block;width:34px;border-top:3px solid #222;margin:0 8px 0 26px;vertical-align:4px"></i>a channel (128)'
    + '<span style="background:#2e7d32"></span>reference (16)<span style="background:#f9a825"></span>bias (16)'
    + '<span style="background:#7b1fa2;border-radius:2px"></span>IMU (48)';
  document.body.appendChild(d); }
const scene = new THREE.Scene();
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3));
g.setIndex(data.index); g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: 0xd9d4cf})));
const col = {P: 0xc62828, N: 0x1565c0, ref: 0x2e7d32, bias: 0xf9a825, imu: 0x7b1fa2};
const show = (q.get('layers') || 'emg,ref,bias,imu').split(',');
const only = q.get('only') ? q.get('only').split(',') : null;      // modules to show, the rest left out
const shown = m => !only || only.includes(m);
for (const e of data.electrodes) {
  if (!show.includes(e.layer) || !shown(e.module)) continue;
  const c = e.layer === 'emg' ? col[e.pole] : col[e.layer];
  const rad = e.layer === 'emg' ? 0.07 : 0.085;
  const m = e.layer === 'imu'
    ? new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.06, 0.2), new THREE.MeshLambertMaterial({color: c}))
    : new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, 0.05, 20), new THREE.MeshLambertMaterial({color: c}));
  const n = new THREE.Vector3(...e.n), p = new THREE.Vector3(...e.p).addScaledVector(n, 0.02);
  m.position.copy(p); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
  scene.add(m);
}
if (data.chords) data.chords.forEach((pts, i) => { if (!shown(data.chord_modules[i])) return;
  if (pts.length > 2) {
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.018, 6, false),
                             new THREE.MeshLambertMaterial({color: 0x333333})));
    return;
  }
  const [a, b] = pts;
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
  const ln = new THREE.Line(lg, new THREE.LineBasicMaterial({color: 0x222222, depthTest: q.get('xray') ? false : true, transparent: true, opacity: 0.85}));
  ln.renderOrder = 2; scene.add(ln);
});
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
const view = q.get('view') || 'front';
const T = {front:[0,0,40], back:[0,0,-40], left:[40,0,0], right:[-40,0,0],
           hand:[18,12,9], foot:[16,10,24], neck:[10,4,-40], iso:[28,18,32], isoback:[-28,18,-32]}[view] || [0,0,40];
const target = {hand:[4.3,2.3,1.9], foot:[2.25,-7.8,0.6], neck:[0.4,5.2,-0.3]}[view] || [0,0,0];
const span = {hand:2.8, foot:2.6, neck:4.2}[view] || 18.5;
const cam = new THREE.OrthographicCamera(-span*W/H/2, span*W/H/2, span/2, -span/2, 0.1, 200);
cam.position.set(target[0]+T[0], target[1]+T[1], target[2]+T[2]); cam.lookAt(...target);
key.position.copy(cam.position).add(new THREE.Vector3(10, 20, 0)); scene.add(key);
if (view === 'sheet') {
  r.setScissorTest(true);
  const views0 = [[0,0,40],[0,0,-40],[40,0,0]], w3 = W/views0.length, hh = H - 90;
  views0.forEach((T, i) => {
    const c = new THREE.OrthographicCamera(-19.5*w3/hh/2, 19.5*w3/hh/2, 19.5/2, -19.5/2, 0.1, 200);
    c.position.set(...T); c.lookAt(0,0.3,0);
    key.position.copy(c.position).add(new THREE.Vector3(10, 20, 0));
    r.setViewport(i*w3, 90, w3, hh); r.setScissor(i*w3, 90, w3, hh); r.render(scene, c);
  });
} else r.render(scene, cam);
document.title = 'done';
</script></body></html>
